name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen

      - name: Build (unsigned)
        run: |
          xcodebuild -project OfferCheck.xcodeproj \
            -target OfferCheck \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/OfferCheck.app Payload/
          zip -qry OfferCheck.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: OfferCheck-ipa
          path: OfferCheck.ipa
